<style>

<script>
(function(){
const slides=[
{title:'From 80/90 to “Services!”',sub:'Chamath Palihapitiya on 8090, enterprise software and the opportunity in AI — 2024 to October 2026',kind:'cover',content:'The shift in emphasis, in his own words',foot:[['Period','January 2024–October 2026']]},
{title:'The original proposition was cheaper substitutes for existing SaaS',kind:'quote',quote:'an 80% feature complete version at a 90% discount.',sub:'Use AI and offshoring to rebuild the enterprise software customers already buy.',foot:[['Chamath · January 2024','https://www.linkedin.com/posts/chamath_im-starting-an-incubator-funded-entirely-activity-7151403359109795840-rOM-']]},
{title:'By mid-2026, the discussion had moved beyond replacing SaaS licences',sub:'How his stated emphasis developed',kind:'timeline',active:1,steps:[['2024','80/90 offer'],['JUN 2026','Delivery economics'],['JUL–AUG','Factory + custom software'],['SEP','Work redesign'],['OCT','Services + adoption']] ,foot:[['Timeline compiled from dated public statements']]},
{title:'Chamath no longer committed to the original 90% discount',kind:'quote',quote:'90% less is how it started. I’m not sure if we’ll deliver that.',sub:'8090 had become a software-production and enterprise-delivery business.',note:'He made the pricing qualification himself, without adopting the interviewer’s formulation.',foot:[['This Week in Startups · June 29, 2026 · 68:55','https://pod.wave.co/podcast/this-week-in-startups/chamath-on-why-young-people-need-more-agency-risk-and-adventure']]},
{title:'Chamath estimated that services account for most enterprise software spending',sub:'His June framework for the market that Software Factory addresses',kind:'spend',foot:[['Chamath’s estimates, not audited market totals · June 29, 2026 · 26:09–27:15','https://pod.wave.co/podcast/this-week-in-startups/chamath-on-why-young-people-need-more-agency-risk-and-adventure']]},
{title:'The Software Factory proposition adds accountability for the finished result',kind:'factory',sub:'The five tests he set out for a genuine factory',foot:[['Chamath · July 16, 2026','https://www.8090.ai/blog/what-is-a-software-factory-']]},
{title:'In August, he argued the economics of build versus buy had flipped',kind:'quote',quote:'“off the shelf” is largely replaced with custom software',note:'His stated opportunity: applications incorporating each enterprise’s own business rules, workflows and proprietary context.',foot:[['Chamath · August 1, 2026','https://x.com/chamath/status/2083463694931902561']]},
{title:'From September onward, he focused increasingly on adoption and outcomes',kind:'timeline',active:3,steps:[['2024','80/90 offer'],['JUN 2026','Delivery economics'],['JUL–AUG','Factory + custom software'],['SEP','Work redesign'],['OCT','Services + adoption']],foot:[['September–October events, essays and interviews']]},
{title:'The difference between AI users and AI winners is how they redesign work',kind:'quote',quote:'The tools were identical. What separated the leaders was how they rebuilt their work around them.',note:'Chamath argues that faster production alone does not remove meetings, approvals, coordination and other delays.',foot:[['Chamath · AI ROI essay · September 25, 2026','https://research.socialcapital.com/p/ai-roi']]},
{title:'Deploying agents creates a governance and change-management challenge',kind:'two',blocks:[['Agent governance','Chamath describes a gap in rules, identity, supervision and accountability as organizations deploy many autonomous agents.'],['Change management','He identifies employee and organizational adoption as particularly difficult in heavily regulated enterprises.']],foot:[['Chamath · Dreamforce conversation · September 24, 2026 · 01:39–07:07','https://www.youtube.com/watch?v=iIv6ggetjxE'],['Transcript','https://blumify.io/t/youtube/iIv6ggetjxE/transcript']]},
{title:'Task automation is not equivalent to replacing a complete job',kind:'two',blocks:[['Tasks','AI can increasingly perform well-defined assignments when requirements and review effort are manageable.'],['Jobs','Deciding what matters, coordinating across teams and taking responsibility remain harder to delegate.']],foot:[['Chamath · What AI spend does to headcount · October 2, 2026','https://research.socialcapital.com/p/ai-and-employment']]},
{title:'He wants enterprises to be able to explain AI decisions to auditors',kind:'quote',quote:'make sure you can explain yourself in a world where AI is making decisions.',note:'At IFS Unleashed, he emphasized that organizations remain responsible for agent actions; they cannot simply blame an agent identifier.',foot:[['Chamath at IFS Unleashed · October 13, 2026 · reported by ENGtechnica','https://engtechnica.com/how-to-make-a-software-company-into-an-ai-company-ifs-provides-a-lesson/'],['Constellation Research coverage','https://www.constellationr.com/insights/news/palihapitiya-ai-valuations-energy-auditors']]},
{title:'He is also worried that real-world AI spending has not spread far enough',kind:'quote',quote:'1% of companies represent 90% of AI spending.',note:'In the October 23 All-In episode he argued that a narrow group of startups accounts for much of today’s expenditure, while large enterprises are more deliberative buyers.',foot:[['Chamath · All-In · October 23, 2026 · around 02:24','https://realalpha.app/s/a-small-group-of-startups-drives-most-ai-spending/']]},
{title:'“Services!” is his most direct October opportunity signal',kind:'services',sub:'A one-word response to Social Capital’s AI-spending breakdown',foot:[['Chamath · October 25, 2026','https://x.com/chamath/status/2114155223329747221'],['Original post and context','https://teapawt.org/chamath/status/2114155223329747221']]},
{title:'What the “Services!” remark can be grounded in',sub:'His earlier market definition and 8090’s disclosed business model, not additional claims from the one-word post',kind:'three',blocks:[['Maintenance','Keeping deployed systems functioning and adapting as requirements change.'],['Migration','Modernizing or replacing legacy enterprise software and transferring business rules.'],['Enterprise delivery','Building, hosting and operating customer-specific systems after go-live.']],note:'In June, Chamath described a $4T maintenance / migration / services layer. 8090 separately describes an enterprise-delivery business.',foot:[['Chamath · June 29, 2026 · 26:09–27:15','https://pod.wave.co/podcast/this-week-in-startups/chamath-on-why-young-people-need-more-agency-risk-and-adventure'],['8090 release · June 2026','https://www.morningstar.com/news/business-wire/20260626795833/8090-raises-135m-series-a-to-accelerate-their-rollout-of-software-factory']]},
{title:'In October, Chamath acknowledged a mistake in enterprise sales execution',kind:'sales',sub:'He said 8090 missed Q2 because he had pushed the sales team toward only very large contracts.',quote:'We whiffed Q2. Butchered it.',note:'He expressly took responsibility for instructing three salespeople to focus on gigantic deals. His comments about Q4 were more positive but cautious.',foot:[['Chamath · All-In · October 30, 2026 · 02:41–03:10','https://podscan.fm/podcasts/all-in-with-chamath-jason-sacks-amp-friedberg/episodes/anthropic-s-1-shocker-greatest-business-ever-googles-500b-wipeout-midterm-predictions-1']]},
{title:'His September–October opportunity signals concentrate on five areas',kind:'opportunities',items:[['24 SEP','Agent governance and change management'],['25 SEP','Work redesign to realize AI ROI'],['13 OCT','Auditable AI decisions and accountability'],['25 OCT','Services'],['30 OCT','Enterprise sales discipline and deal selection']],foot:[['Dreamforce','https://www.youtube.com/watch?v=iIv6ggetjxE'],['AI ROI','https://research.socialcapital.com/p/ai-roi'],['IFS','https://www.constellationr.com/insights/news/palihapitiya-ai-valuations-energy-auditors'],['October posts','https://x.com/chamath/status/2114155223329747221'],['All-In transcript','https://podscan.fm/podcasts/all-in-with-chamath-jason-sacks-amp-friedberg/episodes/anthropic-s-1-shocker-greatest-business-ever-googles-500b-wipeout-midterm-predictions-1']]},
{title:'Outside observers describe the change from cheap code to governed delivery',kind:'press',items:[['TECHCRUNCH · JUN','Reports 8090’s $135M round and CEO transition; describes production-quality enterprise development with audit controls.'],['MINT · JUL','Reports his criticism of time-and-materials outsourcing as AI-controlled software production becomes viable.'],['CONSTELLATION · OCT','Highlights his emphasis on AI investment returns, auditing and responsibility for enterprise agent decisions.']],foot:[['TechCrunch','https://techcrunch.com/2026/06/29/chamath-palihapitiya-raises-135m-series-a-for-his-ai-coding-startup-takes-ceo-role/'],['Mint','https://www.livemint.com/technology/timeandmaterials-outsourcing-model-losing-relevance-in-ai-era-8090-ceo-chamath-palihapitiya-11785377778856.html'],['Constellation','https://www.constellationr.com/insights/news/palihapitiya-ai-valuations-energy-auditors']]},
{title:'Listen and read',kind:'sources',items:[['June 29 · This Week in Startups — transcript','https://pod.wave.co/podcast/this-week-in-startups/chamath-on-why-young-people-need-more-agency-risk-and-adventure'],['July 16 · What Is a Software Factory?','https://www.8090.ai/blog/what-is-a-software-factory-'],['September 24 · Dreamforce discussion','https://www.youtube.com/watch?v=iIv6ggetjxE'],['September 25 · AI ROI essay','https://research.socialcapital.com/p/ai-roi'],['October 13 · IFS coverage','https://www.constellationr.com/insights/news/palihapitiya-ai-valuations-energy-auditors'],['October 23 · All-In segment','https://realalpha.app/s/a-small-group-of-startups-drives-most-ai-spending/'],['October 25 · Services post','https://x.com/chamath/status/2114155223329747221'],['October 30 · All-In transcript','https://podscan.fm/podcasts/all-in-with-chamath-jason-sacks-amp-friedberg/episodes/anthropic-s-1-shocker-greatest-business-ever-googles-500b-wipeout-midterm-predictions-1']],foot:[['Dated publication and recording links are clickable above']]}
];
const esc=x=>String(x||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const target=document.getElementById('slide');let pos=0;
function draw(){
const s=slides[pos];const top='<h1>'+esc(s.title)+'</h1>'+(s.sub?'<p class="subtitle">'+esc(s.sub)+'</p>':'');let content='';
if(s.kind==='cover')content='<div><div class="vizlabel">2024 → 2026</div><div class="statement">'+esc(s.content)+'</div><div style="width:190px;height:5px;background:var(--aqua);margin-top:30px"></div></div>';
if(s.kind==='quote'||s.kind==='sales')content='<div class="quote">“'+esc(s.quote)+'”</div>'+(s.note?'<p class="note">'+esc(s.note)+'</p>':'');
if(s.kind==='timeline')content='<div class="timeline">'+s.steps.map((x,i)=>'<div class="step '+(i===s.active?'active':'')+'"><span class="dot"></span><div class="month">'+esc(x[0])+'</div><p>'+esc(x[1])+'</p></div>').join('')+'</div>';
if(s.kind==='spend')content='<div class="vizlabel">$5T estimated annual software spending</div><div class="metrics"><div class="metricA"><div class="amount">$4T</div><div class="what">Maintenance, migration and services</div></div><div class="metricB"><div class="amount">$1T</div><div class="what">Licences</div></div></div><p class="note">Chamath’s own market framing; the amounts are estimates he cited in the interview.</p>';
if(s.kind==='factory')content='<div class="checks">'+['Business intent','Coherent change','Repeatable output','Traceable decisions','Accountable delivery'].map(x=>'<div>'+esc(x)+'</div>').join('')+'</div><p class="note">His July distinction: code-generation tools are not factories unless the production system stands behind the finished software.</p>';
if(s.kind==='two')content='<div class="cols">'+s.blocks.map(x=>'<div class="block"><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>').join('')+'</div>';
if(s.kind==='three')content='<div class="grid3">'+s.blocks.map(x=>'<div class="block"><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>').join('')+'</div>'+(s.note?'<p class="note">'+esc(s.note)+'</p>':'');
if(s.kind==='services')content='<div class="bigword">Services!</div><p class="note" style="max-width:940px">Social Capital’s prompt: projected global AI spending of ~$2.7T in 2026, with only ~1% going directly to model providers. The remaining spend is not all services; Chamath’s reply did not specify categories.</p>';
if(s.kind==='opportunities')content='<div class="list">'+s.items.map(x=>'<div class="item"><span class="d">'+esc(x[0])+'</span><span class="v">'+esc(x[1])+'</span></div>').join('')+'</div>';
if(s.kind==='press')content='<div class="lens">'+s.items.map(x=>'<div class="item"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>').join('')+'</div>';
if(s.kind==='sources')content='<div class="sources">'+s.items.map(x=>'<a href="'+esc(x[1])+'" target="_blank" rel="noopener noreferrer">'+esc(x[0])+' <span>↗</span></a>').join('')+'</div>';
const foot=(s.foot||[]).map(x=>x[1]?'<a href="'+esc(x[1])+'" target="_blank" rel="noopener noreferrer">'+esc(x[0])+' ↗</a>':'<span>'+esc(x[0])+'</span>').join('');
target.innerHTML=top+'<div class="main">'+content+'</div><div class="footnotes"><div class="links">'+foot+'</div><span>'+String(pos+1).padStart(2,'0')+' / '+slides.length+'</span></div>';
document.getElementById('fraction').textContent=String(pos+1).padStart(2,'0')+' / '+slides.length;
document.getElementById('prev').disabled=pos===0;document.getElementById('next').disabled=pos===slides.length-1;document.getElementById('progressbar').style.width=((pos+1)/slides.length*100)+'%';
history.replaceState(null,'','#slide-'+(pos+1));
}
function nav(n){pos=Math.max(0,Math.min(slides.length-1,pos+n));draw()}document.getElementById('prev').onclick=()=>nav(-1);document.getElementById('next').onclick=()=>nav(1);
document.getElementById('full').onclick=()=>{const el=document.getElementById('deck');if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){nav(1);e.preventDefault()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){nav(-1);e.preventDefault()}});
let start=0;target.addEventListener('touchstart',e=>{start=e.changedTouches[0].screenX},{passive:true});target.addEventListener('touchend',e=>{const delta=e.changedTouches[0].screenX-start;if(Math.abs(delta)>55)nav(delta<0?1:-1)},{passive:true});
const found=location.hash.match(/^#slide-(\d+)$/);if(found)pos=Math.max(0,Math.min(slides.length-1,Number(found[1])-1));draw();
})();
